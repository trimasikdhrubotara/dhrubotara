  <div class="post-meta">
    রুবাইয়াত হোসেন · 11 September, 2026
     · সংখ্যা ৩
  </div>
  <div class="post-body">
    <p>এটা আমাদের প্রথম আসল লেখা। এখান থেকে শুরু হলো ধ্রুবতারার নতুন অনলাইন যাত্রা।</p>
<p>আপনি এই জায়গায় যেকোনো গল্প, কবিতা বা প্রবন্ধ লিখতে পারবেন। প্রতিটা প্যারাগ্রাফ একটা খালি লাইন দিয়ে আলাদা করবেন।</p>

  </div>
