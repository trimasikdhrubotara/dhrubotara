<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সব লেখা — {{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
<style>
  .list-wrap{max-width:820px;margin:0 auto;padding:60px 28px 80px;}
  .list-title{font-size:30px;margin:0 0 40px;}
  .back-link{display:inline-block;margin-bottom:30px;color:var(--crimson);font-weight:700;font-size:14px;}
  .list-item{padding:24px 0;border-bottom:1px solid var(--paper-deep);display:flex;gap:20px;align-items:flex-start;}
  .list-item .text{flex:1;min-width:0;}
  .list-item .thumb{width:120px;height:90px;object-fit:cover;border-radius:4px;flex-shrink:0;}
  .list-item .cat{color:var(--crimson);font-weight:700;font-size:12px;display:block;margin-bottom:8px;}
  .list-item h3{font-size:20px;margin:0 0 8px;}
  .list-item .meta{font-size:13px;color:var(--ink-soft);font-weight:600;}
  @media (max-width:520px){
    .list-item .thumb{width:84px;height:64px;}
  }
</style>
</head>
<body>
<div class="list-wrap">
  <a class="back-link" href="{{ "/" | relURL }}">← হোমে ফিরুন</a>
  <h1 class="list-title">সব লেখা</h1>
  {{ range .Pages.ByDate.Reverse }}
  <div class="list-item" data-cat="{{ .Params.category }}">
    <div class="text">
      <span class="cat">{{ .Params.category }}</span>
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <div class="meta">{{ with .Params.author }}{{ . }} · {{ end }}{{ .Date.Format "2 January, 2006" }}</div>
    </div>
    {{ with .Params.image }}<img class="thumb" src="{{ . | relURL }}" alt="{{ $.Title }}" loading="lazy">{{ end }}
  </div>
  {{ end }}
</div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var cat = params.get('cat');
  if(!cat) return;
  var items = document.querySelectorAll('.list-item');
  var isKobita = (cat.indexOf('কবিতা') > -1 || cat.indexOf('ছড়া') > -1);
  items.forEach(function(item){
    var itemCat = (item.getAttribute('data-cat') || '').trim();
    var match;
    if(isKobita){
      match = (itemCat.indexOf('কবিতা') > -1 || itemCat.indexOf('ছড়া') > -1);
    } else {
      match = (itemCat === cat.trim());
    }
    item.style.display = match ? 'flex' : 'none';
  });
  var titleEl = document.querySelector('.list-title');
  if(titleEl){ titleEl.textContent = cat; }
})();
</script>
</body>
</html>
