<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সব লেখা — {{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
<style>
  .list-wrap{max-width:1200px;margin:0 auto;padding:60px 28px 80px;}
  .list-title{font-size:30px;margin:0 0 24px;}
  .back-link{display:inline-block;margin-bottom:30px;color:var(--crimson);font-weight:700;font-size:14px;}
  .searchbox{width:100%;max-width:460px;padding:12px 16px;font-size:16px;font-family:inherit;border:1px solid var(--paper-deep);border-radius:6px;background:#fff;color:var(--ink);margin:0 0 36px;display:block;}
  .searchbox:focus{outline:none;border-color:var(--crimson);}
  .empty-msg{display:none;color:var(--ink-soft);font-size:16px;padding:20px 0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:36px 28px;}
  .card{display:block;text-decoration:none;color:inherit;border-bottom:1px solid var(--paper-deep);padding-bottom:18px;}
  .card .pic{width:100%;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--paper-dim);margin-bottom:12px;}
  .card .pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
  .card:hover .pic img{transform:scale(1.04);}
  .card .pic.empty{display:flex;align-items:center;justify-content:center;}
  .card .pic.empty img{width:64px;height:64px;object-fit:contain;opacity:.35;border-radius:8px;}
  .card:hover .pic.empty img{transform:none;}
  .badge{display:inline-block;background:var(--crimson);color:#fff;font-weight:700;font-size:12px;padding:3px 9px;border-radius:3px;margin-bottom:8px;}
  .card h3{font-size:18px;line-height:1.5;margin:0 0 6px;}
  .card .meta{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .card:hover h3{color:var(--crimson);}
</style>
</head>
<body>
<div class="list-wrap">
  <a class="back-link" href="{{ "/" | relURL }}">← হোমে ফিরুন</a>
  <h1 class="list-title">সব লেখা</h1>
  <input id="q" class="searchbox" type="search" placeholder="লেখা খুঁজুন…" autocomplete="off">
  <p id="empty" class="empty-msg">কোনো লেখা পাওয়া যায়নি।</p>
  <div class="grid">
  {{ range .Pages.ByDate.Reverse }}
    <a class="card list-item" href="{{ .RelPermalink }}" data-cat="{{ .Params.category }}">
      {{ if .Params.image }}
      <div class="pic"><img src="{{ .Params.image | relURL }}" alt="" loading="lazy"></div>
      {{ else }}
      <div class="pic empty"><img src="{{ "favicon-192.png" | relURL }}" alt=""></div>
      {{ end }}
      <span class="badge">{{ .Params.category }}</span>
      <h3>{{ .Title }}</h3>
      <div class="meta">{{ with .Params.author }}{{ . }} · {{ end }}{{ .Date.Format "2 January, 2006" }}</div>
    </a>
  {{ end }}
  </div>
</div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var cat = (params.get('cat') || '').trim();
  var box = document.getElementById('q');
  var empty = document.getElementById('empty');
  var items = document.querySelectorAll('.list-item');
  var isKobita = (cat.indexOf('কবিতা') > -1 || cat.indexOf('ছড়া') > -1);
  box.value = params.get('q') || '';

  function apply(){
    var q = box.value.trim().toLowerCase();
    var shown = 0;
    items.forEach(function(item){
      var itemCat = (item.getAttribute('data-cat') || '').trim();
      var okCat = true;
      if(cat){
        okCat = isKobita
          ? (itemCat.indexOf('কবিতা') > -1 || itemCat.indexOf('ছড়া') > -1)
          : (itemCat === cat);
      }
      var okQ = !q || item.textContent.toLowerCase().indexOf(q) > -1;
      var ok = okCat && okQ;
      item.style.display = ok ? '' : 'none';
      if(ok) shown++;
    });
    empty.style.display = shown ? 'none' : 'block';
  }

  if(cat){
    var titleEl = document.querySelector('.list-title');
    if(titleEl){ titleEl.textContent = cat; }
    box.placeholder = 'এই বিভাগে খুঁজুন…';
  }
  box.addEventListener('input', apply);
  apply();
})();
</script>
</body>
</html>
