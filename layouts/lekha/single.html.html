<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }} — {{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
<style>
  .post-wrap{max-width:760px;margin:0 auto;padding:60px 28px 80px;}
  .post-cat{color:var(--crimson);font-weight:700;font-size:13px;margin-bottom:16px;display:block;}
  .post-title{font-size:34px;line-height:1.3;margin:0 0 16px;}
  .post-meta{color:var(--ink-soft);font-size:14px;margin-bottom:36px;font-weight:600;}
  .post-body{font-size:18px;line-height:2;color:var(--ink);}
  .post-body p{margin:0 0 22px;}
  .back-link{display:inline-block;margin-bottom:30px;color:var(--crimson);font-weight:700;font-size:14px;}
</style>
</head>
<body>
<div class="post-wrap">
  <a class="back-link" href="{{ "/" | relURL }}">← হোমে ফিরুন</a>
  <span class="post-cat">{{ .Params.category }}</span>
  <h1 class="post-title">{{ .Title }}</h1>
  <div class="post-meta">
    {{ with .Params.author }}{{ . }} · {{ end }}{{ .Date.Format "2 January, 2006" }}
    {{ with .Params.issue }} · {{ . }}{{ end }}
  </div>
  <div class="post-body">
    {{ .Content }}
  </div>
</div>
</body>
</html>
