<!DOCTYPE html> <html lang="bn"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>ছাপা সংখ্যার আর্কাইভ — {{ .Site.Title }}</title> <link rel="stylesheet" href="{{ "css/style.css" | relURL }}"> <style> .archive-page-wrap{max-width:1000px;margin:0 auto;padding:60px 28px;} .archive-page-wrap h1{font-size:30px;margin:0 0 32px;} .back-link{display:inline-block;margin-bottom:24px;color:var(--crimson);font-weight:700;} .archive-page-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;} </style> </head> <body> <div class="archive-page-wrap"> <a class="back-link" href="{{ "/" | relURL }}">← হোমে ফিরুন</a> <h1>ছাপা সংখ্যার আর্কাইভ</h1> <div class="archive-page-grid"> {{ range .Pages.ByDate.Reverse }} <a class="issue-card" href="{{ .Params.pdf | relURL }}" target="_blank" rel="noopener"> <img class="issue-cover" src="{{ .Params.cover | relURL }}" alt="{{ .Title }}"> <div class="issue-number">{{ .Params.issue_number }}</div> <div class="issue-info"> <strong>{{ .Title }}</strong> <span>{{ .Date.Format "January 2006" }}</span> <small>সংখ্যাটি পড়ুন →</small> </div> </a> {{ end }} </div> </div> </body> </html>
